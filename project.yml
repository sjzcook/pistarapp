name: BrandMeister

options:
  bundleIdPrefix: com.pistar
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: "NO"
    CLANG_ENABLE_MODULES: "YES"
    DEAD_CODE_STRIPPING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  BrandMeisterKit:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/BrandMeisterKit
    settings:
      base:
        PRODUCT_NAME: BrandMeisterKit
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  BrandMeister:
    type: application
    platform: iOS
    sources:
      - path: Sources/BrandMeisterApp
    dependencies:
      - target: BrandMeisterKit
    settings:
      base:
        PRODUCT_NAME: BrandMeister
        PRODUCT_BUNDLE_IDENTIFIER: com.pistar.BrandMeister
        PRODUCT_NAME: Pi-Star
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Pi-Star
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"

  bmwatch:
    type: tool
    platform: macOS
    sources:
      - path: Sources/bmwatch
    dependencies:
      - target: BrandMeisterKit
    settings:
      base:
        PRODUCT_NAME: bmwatch
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BrandMeister:
    build:
      targets:
        BrandMeister: all
    run:
      config: Debug
    archive:
      config: Release

  bmwatch:
    build:
      targets:
        bmwatch: all
    run:
      config: Debug
