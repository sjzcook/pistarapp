name: Build unsigned iOS IPA (Xcode 27)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Config/**"
      - "project.yml"
      - "Package.swift"
      - "Scripts/**"
      - ".github/workflows/build-unsigned-ipa.yml"

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive and package unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print -quit)"
          if [[ -z "$XCODE_APP" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            ls -1d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          if ! grep -q '^Xcode 27\.' <<< "$XCODE_VERSION"; then
            echo "::error::Expected Xcode 27, but found a different version."
            exit 1
          fi

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate native iOS project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d BrandMeister.xcodeproj
          xcodebuild -list -project BrandMeister.xcodeproj

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project BrandMeister.xcodeproj \
            -scheme BrandMeister \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PiStarApp.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$PWD/build-xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/PiStarApp.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::The archive contains no iOS .app. Check the archive log."
            exit 1
          fi
          IPA_DIR="$PWD/build/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && /usr/bin/zip -qry "$PWD/../PiStarApp-unsigned.ipa" Payload)
          test -s build/PiStarApp-unsigned.ipa
          unzip -l build/PiStarApp-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PiStarApp-unsigned-ipa
          path: |
            build/PiStarApp-unsigned.ipa
            build-xcodebuild.log
          if-no-files-found: error
          retention-days: 14
